<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 150" width="100%" height="100%">
  <style>
    .serif-text {
      font-family: 'Times New Roman', Times, 'Playfair Display', Georgia, serif;
      font-weight: bold;
      fill: #FFFFFF;
    }
  </style>
  <g class="serif-text">
    <!-- M -->
    <text x="20" y="95" font-size="105" letter-spacing="-2">M</text>
    <!-- First O -->
    <text x="145" y="95" font-size="105" letter-spacing="-2">o</text>
    <!-- Second O with Crescent cutout -->
    <text x="238" y="95" font-size="105" letter-spacing="-2">o</text>
    <!-- Crescent Moon overlay inside the second O -->
    <path d="M 288 38 A 22 26 0 0 1 288 88 A 16 22 0 0 0 288 38 Z" fill="#FFFFFF" />
    <!-- N -->
    <text x="330" y="95" font-size="105" letter-spacing="-2">N</text>
  </g>
  
  <!-- Underline Swoosh Curve -->
  <path d="M 12 128 Q 210 98 380 108" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Airplane Icon at end of curve -->
  <g transform="translate(378, 102) rotate(15) scale(0.7)">
    <polygon points="0,8 18,0 12,16 8,11 3,13 4,9" fill="#FFFFFF"/>
  </g>
</svg>
